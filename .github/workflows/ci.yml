name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Install built wheel and run outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          dqo demo --output package-demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/package-demo/report.*

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dqo
          POSTGRES_PASSWORD: dqo
          POSTGRES_DB: observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dqo -d observability"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DQO_DATABASE_URL: postgresql://dqo:dqo@localhost:5432/observability

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install -r requirements-airflow.txt

      - name: Initialize Airflow metadata database
        run: airflow db migrate
        env:
          AIRFLOW_HOME: /tmp/airflow

      - name: Validate contract registry
        run: python scripts/validate_registry.py

      - name: Check contract version bump discipline
        if: github.event_name == 'pull_request'
        run: python scripts/validate_registry.py --base ${{ github.event.pull_request.base.sha }}

      - name: Run tests
        run: python -m pytest -q
        env:
          AIRFLOW_HOME: /tmp/airflow

      - name: Smoke test CLI
        run: |
          python -m src.dqo.cli run \
            --contract contracts/orders.yml \
            --data data/samples/orders.csv \
            --references data/samples \
            --reference-time 2026-07-14T12:00:00Z \
            --history-db "$DQO_DATABASE_URL"
